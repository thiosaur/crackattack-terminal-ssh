# Generated by tools/coolify-compose.sh from compose.yml: do not edit.
#
# Variant of compose.yml for Coolify, which refuses a variable in the source of a volume: the
# players keys directory is a named volume bound to KEYS_DIR, and the one-shot import is left out.
#
# Create the application from this repository with the Docker Compose build pack and this file.
# Create the directory on the server, put the keys in it (any file, one public key per line), and
# set the variables KEYS_DIR (its absolute path), CRACKATTACK_VERSION, CRACKATTACK_ARCHIVE and
# CRACKATTACK_SHA256 (the values of .env: Coolify does not read it). Or give the keys in
# AUTHORIZED_KEYS. No domain is needed: Traefik routes HTTP, not ssh.
#
services:
  crackattack:
    build:
      context: .
      additional_contexts:
        crackattack-src: ${CRACKATTACK_SRC:-.}
      args:
        BINARY_FROM: ${BINARY_FROM:-release}
        CRACKATTACK_VERSION: ${CRACKATTACK_VERSION}
        CRACKATTACK_ARCHIVE: ${CRACKATTACK_ARCHIVE:-linux-x86_64-static}
        CRACKATTACK_SHA256: ${CRACKATTACK_SHA256:-}
    image: ${IMAGE:-crackattack-terminal-ssh}:${CRACKATTACK_VERSION}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-2222}:2222"
    environment:
      AUTH_MODE: ${AUTH_MODE:-keys}
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:-}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-300}
      MAX_TIME: ${MAX_TIME:-1800}
      MAX_PLAYERS: ${MAX_PLAYERS:-10}
      COMPACT: ${COMPACT:-0}
      INVITES: ${INVITES:-0}
      INVITE_HOST: ${INVITE_HOST:-}
      INVITE_PORT: ${INVITE_PORT:-2222}
    volumes:
      - host-keys:/keys
      # The players' keys, read at each login: a key added or removed counts at once. Read-only.
      - players:/players:ro
    restart: unless-stopped
    # The log holds the players' addresses (sshd logs each connection): keep it short.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Hardening: nothing is writable but tmpfs, and the number of games is capped by the
    # limits below.
    read_only: true
    tmpfs:
      - /run:mode=755,uid=10222,gid=10222
      - /tmp
    # sshd runs as `play` (uid 10222): no capability at all.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: ${PIDS_LIMIT:-128}
    mem_limit: 512m
    cpus: 2


volumes:
  host-keys:
  players:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KEYS_DIR}
